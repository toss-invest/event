  <title>나스닥 상장 예정 기념 이벤트 | 토스증권</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: #151c30;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      word-break: keep-all;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #182e57;
      outline-offset: 4px;
    }

    header {
      background: white;
    }

    .bar {
      max-width: 1240px;
      margin: auto;
      padding: 0 4%;
      height: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .logo {
      width: 116px;
      display: block;
    }

    nav {
      display: flex;
      gap: 30px;
      font-size: 14px;
      color: #425069;
      font-weight: 600;
    }

    nav a:hover {
      color: #176be2;
    }

    .button {
      display: inline-block;
      background: #2677ef;
      color: white;
      font-weight: 700;
      border-radius: 12px;
    }

    .bar .button {
      justify-self: end;
      padding: 11px 16px;
      font-size: 14px;
    }

    main {
      min-height: calc(100svh - 64px);
      padding: clamp(56px, 10vh, 120px) 20px 32px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 4% 4%, #dcecff, transparent 55%), radial-gradient(ellipse at 92% 88%, #e3eeff, transparent 46%), linear-gradient(#eaf4ff, #f8faff);
    }

    .content {
      width: min(100%, 850px);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin: 0;
      background: #3182f6;
      color: white;
      padding: 10px 25px;
      border-radius: 30px;
      font-weight: 800;
      letter-spacing: .13em;
      box-shadow: 0 6px 18px #3182f626;
    }

    h1 {
      margin: 16px 0 12px;
      font-size: clamp(34px, 5.1vw, 64px);
      line-height: 1.18;
      letter-spacing: -.067em;
    }

    .intro {
      margin: 0;
      color: #58677b;
      font-size: 17px;
      line-height: 1.55;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 640px;
      margin: 44px auto 0;
      text-align: left;
    }

    article {
      padding: 30px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 9px 32px #476caa17;
    }

    article h2 {
      margin: 0;
      color: #4a6689;
      font-size: 15px;
    }

    article p {
      margin: 20px 0 4px;
      font-weight: 800;
      font-size: clamp(29px, 3.4vw, 44px);
      letter-spacing: -.065em;
      color: #2172e8;
    }

    .new {
      background: #2677ef;
    }

    .new h2,
    .new p {
      color: white;
    }

    .join-event {
      margin-top: 34px;
      padding: 17px 34px;
      box-shadow: 0 8px 18px #2677ef26;
    }

    .button[href]:hover {
      background: #1968dc;
    }

    .note {
      margin: 17px 0 0;
      font-size: 12px;
      color: #63748b;
    }

    @media (max-width:600px) {
      .bar {
        height: 56px;
        grid-template-columns: 1fr auto;
      }

      .logo {
        width: 100px;
      }

      nav {
        display: none;
      }

      main {
        min-height: calc(100svh - 56px);
        padding: 40px 18px 28px;
      }

      .intro {
        font-size: 15px;
      }

      .cards {
        gap: 10px;
        margin-top: 30px;
      }

      article {
        padding: 21px 14px;
      }

      article p {
        font-size: clamp(21px, 5.7vw, 32px);
      }

      .join-event {
        margin-top: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
